<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HermitWatch</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e8ee; --dim:#8b93a7; --acc:#e0894a;
    --text-primary:#e6e8ee; --text-secondary:#b4bacb; --text-muted:#8b93a7;
    --grid:#262b36; --axis:#3a4050;
    --series-motion:#3987e5;   /* categorical slot 1 (dark), validated vs #171a21 */
    --series-manual:#d95926;   /* categorical slot 2 (dark) */
    --rec:#ff5a5a;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 -apple-system,system-ui,sans-serif;
         display:flex; height:100vh; overflow:hidden; }
  button, a.btn { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px;
           padding:6px 10px; cursor:pointer; font-size:12px; text-decoration:none; display:inline-block; }
  button:hover, a.btn:hover { border-color:var(--acc); }
  button.del:hover { border-color:var(--rec); color:var(--rec); }
  button:disabled { opacity:.4; cursor:default; border-color:var(--line); }
  select { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px; }

  /* ---- video area ---- */
  #view { flex:1; display:flex; flex-direction:column; min-width:0; }
  #video { flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:0; background:#000; }
  #video img, #video video { max-width:100%; max-height:100%; }
  #player { display:none; }
  #badge { position:absolute; top:12px; left:12px; font:600 11px/1 ui-monospace,Menlo,monospace; letter-spacing:.8px;
           padding:5px 8px; border-radius:4px; background:rgba(0,0,0,.6); }
  #badge.live::before { content:'● '; color:var(--rec); }
  #playbar { display:none; align-items:center; gap:8px; padding:8px 12px; border-top:1px solid var(--line); background:var(--panel); }
  #playbar .title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #playbar .back { border-color:var(--acc); color:var(--acc); font-weight:600; }
  body.playing #playbar { display:flex; }
  body.playing #player { display:block; }
  body.playing #live { display:none; }
  #status { padding:8px 14px; font:12px ui-monospace,Menlo,monospace; color:var(--dim);
            border-top:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rec { color:var(--rec); font-weight:600; } .mov { color:var(--acc); font-weight:600; }

  /* ---- side panel ---- */
  #panel { width:380px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #tabs { display:flex; border-bottom:1px solid var(--line); }
  #tabs button { flex:1; border:0; border-radius:0; background:transparent; padding:12px 0; font-size:13px; color:var(--dim);
                 border-bottom:2px solid transparent; }
  #tabs button.on { color:var(--fg); border-bottom-color:var(--acc); }
  .tab { overflow-y:auto; padding:6px 16px 24px; flex:1; display:none; }
  .tab.on { display:block; }
  h1 { font-size:16px; margin:12px 0 4px; letter-spacing:.3px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:18px 0 8px;
       padding-top:12px; border-top:1px solid var(--line); font-weight:600; }
  h2 .sub { text-transform:none; letter-spacing:0; font-weight:400; }
  .row { margin:9px 0; }
  .row.hidden { display:none; }
  .lab { display:flex; justify-content:space-between; font-size:13px; margin-bottom:3px; }
  .val { color:var(--dim); font-variant-numeric:tabular-nums; cursor:pointer; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  label.chk { display:flex; align-items:center; gap:8px; cursor:pointer; }
  input[type=checkbox] { accent-color:var(--acc); width:16px; height:16px; }
  .btns { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .hint { color:var(--dim); font-size:11px; }

  /* ---- recordings ---- */
  .dayrow { display:flex; gap:8px; align-items:center; margin-top:12px; }
  .dayrow select { flex:1; }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .tile { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .tile .k { font-size:11px; color:var(--text-muted); }
  .tile .v { font-size:18px; font-weight:600; color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .tile .s { font-size:11px; color:var(--text-secondary); }
  .chart { width:100%; display:block; overflow:visible; }
  .chart text { fill:var(--text-muted); font:10px -apple-system,system-ui,sans-serif; }
  .chart .hit { fill:transparent; cursor:pointer; }
  .chart .hit:hover + .mark, .chart .mark.sel { stroke:var(--text-primary); stroke-width:1.5; }
  .legend { display:flex; gap:14px; font-size:11px; color:var(--text-secondary); margin:6px 0 2px; align-items:center; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  .charthead { display:flex; justify-content:space-between; align-items:baseline; }
  .charthead button { padding:3px 7px; font-size:11px; }
  #tip { position:fixed; pointer-events:none; background:#000; color:var(--text-primary); border:1px solid var(--axis);
         border-radius:6px; padding:6px 8px; font-size:12px; line-height:1.35; display:none; z-index:10; max-width:240px; }
  #tip b { font-weight:600; } #tip .m { color:var(--text-secondary); }
  .log { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; }
  .log th { text-align:left; font-weight:500; color:var(--text-muted); font-size:11px; padding:4px 4px; border-bottom:1px solid var(--line); }
  .log td { padding:5px 4px; border-bottom:1px solid var(--line); color:var(--text-secondary); white-space:nowrap; }
  .log td.t { color:var(--text-primary); }
  .log tr.clip { cursor:pointer; } .log tr.clip:hover td { background:#1d212a; }
  .log tr.sel td { background:#232836; }
  .log td.act { text-align:right; } .log td.act button, .log td.act a.btn { padding:2px 6px; font-size:11px; }
  .sw { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; }
  .tl { display:flex; gap:10px; align-items:center; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .tl img { width:96px; aspect-ratio:4/3; object-fit:cover; border-radius:4px; background:#000; }
  .tl .info { flex:1; min-width:0; font-size:12px; color:var(--text-secondary); }
  .tl .info b { color:var(--text-primary); }
  .tl .actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .tl select { width:auto; padding:3px; font-size:11px; }
  .empty { color:var(--dim); font-size:12px; padding:8px 0; }
  @media (max-width: 800px) { body { flex-direction:column; overflow:auto; height:auto; }
    #panel { width:auto; border-left:0; } #video { min-height:50vh; } .tab { overflow:visible; } }
</style></head>
<body>
<div id="view">
  <div id="video">
    <img id="live" src="/stream.mjpg" alt="live stream">
    <video id="player" controls playsinline></video>
    <div id="badge" class="live">LIVE</div>
  </div>
  <div id="playbar">
    <button onclick="step(-1)" id="prevBtn" title="Previous (older) clip">◀ Prev</button>
    <span class="title" id="ptitle"></span>
    <button onclick="step(1)" id="nextBtn" title="Next (newer) clip">Next ▶</button>
    <button class="back" onclick="goLive()" title="Esc">← Back to live</button>
  </div>
  <div id="status">connecting…</div>
</div>

<div id="panel">
  <div id="tabs">
    <button data-tab="camera" class="on" onclick="showTab('camera')">Camera</button>
    <button data-tab="recordings" onclick="showTab('recordings')">Recordings</button>
  </div>

  <div class="tab on" id="tab-camera">
    <h1>HermitWatch</h1>
    <div class="hint">Changes apply live and are saved on the Pi. Double-click a value to reset it.</div>
    <div class="btns">
      <button onclick="api('/api/record', {seconds: 30})" title="Record a 30 s clip now, motion or not">Record 30 s</button>
      <button onclick="window.open('/snapshot.jpg?'+Date.now())">Snapshot</button>
      <button onclick="lockExposure()" title="Switch to manual using the current auto exposure">Lock exposure</button>
      <button onclick="lockWB()" title="Switch to manual using the current auto white balance">Lock white balance</button>
      <button onclick="resetAll()">Reset all</button>
    </div>
    <div id="controls"></div>
  </div>

  <div class="tab" id="tab-recordings">
    <div class="dayrow">
      <select id="day" onchange="selectedDay = this.value; renderRecordings()"></select>
      <button onclick="api('/api/record', {seconds: 30}).then(loadLibrary)" title="Record a 30 s clip now">Record 30 s</button>
    </div>
    <div class="hint" id="disk" style="margin-top:6px"></div>
    <div class="tiles" id="tiles"></div>

    <h2><div class="charthead"><span>Recording timeline</span><button id="fitBtn" onclick="fitTimeline = !fitTimeline; renderRecordings()"></button></div></h2>
    <div class="legend" id="tlLegend">
      <span><i style="background:var(--series-motion)"></i>Motion</span>
      <span><i style="background:var(--series-manual)"></i>Manual</span>
    </div>
    <svg class="chart" id="timeline" role="img" aria-label="Clips on a time axis; details in the recording log below"></svg>

    <h2>Recorded per hour <span class="sub" id="hourUnit"></span></h2>
    <div class="legend" id="hrLegend">
      <span><i style="background:var(--series-motion)"></i>Motion</span>
      <span><i style="background:var(--series-manual)"></i>Manual</span>
    </div>
    <svg class="chart" id="hourly" role="img" aria-label="Recording time per hour; details in the recording log below"></svg>

    <h2>Time-lapse</h2>
    <div id="tlapse"></div>

    <h2>Recording log <span class="sub" id="logCount"></span></h2>
    <div id="log"></div>
  </div>
</div>
<div id="tip"></div>

<script>
// ======================================================================
// shared
// ======================================================================
async function api(path, body) {
  const opts = body === undefined ? {} :
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || (path + ' ' + r.status));
  return j;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);

function showTab(name) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.id === 'tab-' + name));
  history.replaceState(null, '', name === 'camera' ? '#' : '#' + name);
  if (name === 'recordings') loadLibrary();
}

// ======================================================================
// camera controls
// ======================================================================
let schema = [], values = {}, pending = {}, inflight = false;
const els = {};
const LOGN = 1000;
const toPos = (f, v) => f.scale === 'log' ? Math.round(LOGN * Math.log(v / f.min) / Math.log(f.max / f.min)) : v;
const fromPos = (f, p) => f.scale === 'log' ? Math.round(f.min * Math.pow(f.max / f.min, p / LOGN)) : +p;

function fmt(f, v) {
  if (f.unit === 'us') return v >= 1000 ? (v / 1000).toFixed(v >= 100000 ? 0 : 1) + ' ms' : v + ' µs';
  const d = f.step >= 1 ? 0 : String(f.step).split('.')[1].length;
  return (+v).toFixed(d) + (f.unit ? ' ' + f.unit : '');
}

function visible(f) {
  if (!f.when) return true;
  const neg = f.when[0] === '!';
  const on = !!values[f.when.replace('!', '')];
  return neg ? !on : on;
}

function build() {
  const root = $('controls');
  root.innerHTML = '';
  let group = null;
  for (const f of schema) {
    if (f.group !== group) {
      group = f.group;
      const h = document.createElement('h2'); h.textContent = group; root.appendChild(h);
    }
    const row = document.createElement('div'); row.className = 'row';
    let input, val;
    if (f.type === 'bool') {
      const lab = document.createElement('label'); lab.className = 'chk';
      input = document.createElement('input'); input.type = 'checkbox';
      input.onchange = () => send(f.id, input.checked);
      lab.append(input, document.createTextNode(f.label));
      row.appendChild(lab);
    } else {
      const head = document.createElement('div'); head.className = 'lab';
      const name = document.createElement('span'); name.textContent = f.label;
      val = document.createElement('span'); val.className = 'val'; val.title = 'double-click to reset';
      val.ondblclick = () => send(f.id, f.default);
      head.append(name, val); row.appendChild(head);
      if (f.type === 'select') {
        input = document.createElement('select');
        f.options.forEach((o, i) => input.add(new Option(o, i)));
        input.onchange = () => send(f.id, +input.value);
        val.style.display = 'none';
      } else {
        input = document.createElement('input'); input.type = 'range';
        if (f.scale === 'log') { input.min = 0; input.max = LOGN; input.step = 1; }
        else { input.min = f.min; input.max = f.max; input.step = f.step; }
        input.oninput = () => { const v = fromPos(f, input.value); val.textContent = fmt(f, v); send(f.id, v); };
        input.ondblclick = () => send(f.id, f.default);
      }
      row.appendChild(input);
    }
    root.appendChild(row);
    els[f.id] = { f, row, input, val };
  }
}

function sync() {
  for (const { f, row, input, val } of Object.values(els)) {
    row.classList.toggle('hidden', !visible(f));
    if (document.activeElement === input && f.type === 'range') continue;
    const v = values[f.id];
    if (f.type === 'bool') input.checked = !!v;
    else if (f.type === 'select') input.value = v;
    else { input.value = toPos(f, v); val.textContent = fmt(f, v); }
  }
}

function send(id, v) {
  values[id] = v; pending[id] = v;
  for (const { f, row } of Object.values(els)) row.classList.toggle('hidden', !visible(f));
  flush();
}

async function flush(extra) {
  if (inflight || (!Object.keys(pending).length && !extra)) return;
  inflight = true;
  const body = Object.assign({}, pending, extra || {}); pending = {};
  try { const r = await api('/api/settings', body); values = Object.assign(r.values, pending); }
  catch (e) { $('status').textContent = 'error: ' + e.message; }
  finally { inflight = false; }
  if (Object.keys(pending).length) flush(); else sync();
}

async function resetAll() {
  if (!confirm('Reset all camera and recording settings to defaults?')) return;
  pending = {}; await flush({ reset: true });
}

async function lockExposure() {
  const s = await api('/api/status');
  if (!s.ExposureTime) return;
  pending = Object.assign(pending, { ae_auto: false, exposure_us: s.ExposureTime, gain: +s.AnalogueGain.toFixed(1) });
  values = Object.assign(values, pending); sync(); flush();
}

async function lockWB() {
  const s = await api('/api/status');
  if (!s.ColourGains) return;
  pending = Object.assign(pending, { awb_auto: false, red_gain: +s.ColourGains[0].toFixed(2), blue_gain: +s.ColourGains[1].toFixed(2) });
  values = Object.assign(values, pending); sync(); flush();
}

let wasRecording = false;
async function pollStatus() {
  try {
    const s = await api('/api/status');
    const parts = [];
    const m = s.motion;
    if (m) {
      if (m.recording) parts.push('<span class="rec">● REC' + (m.forced ? ' (manual)' : '') + '</span>');
      if (m.lighting_change) parts.push('lighting change (ignored)');
      else parts.push((m.moving ? '<span class="mov">MOTION</span> ' : 'motion ') + m.score.toFixed(2) + '%');
      // refresh the log when a recording starts or stops
      if (m.recording !== wasRecording) { wasRecording = m.recording; if (tabIs('recordings')) loadLibrary(); }
    }
    if (s.ExposureTime) parts.push('shutter ' + (s.ExposureTime / 1000).toFixed(1) + ' ms');
    if (s.AnalogueGain) parts.push('gain ' + s.AnalogueGain.toFixed(2));
    if (s.FrameDuration) parts.push((1e6 / s.FrameDuration).toFixed(1) + ' fps');
    if (s.ColourTemperature) parts.push(s.ColourTemperature + ' K');
    if (s.Lux !== undefined) parts.push(s.Lux.toFixed(0) + ' lux');
    $('status').innerHTML = parts.join('  ·  ') || 'no status';
  } catch (e) { $('status').textContent = 'status unavailable'; }
  setTimeout(pollStatus, 1000);
}
const tabIs = name => $('tab-' + name).classList.contains('on');

// ======================================================================
// player: recordings play in the main video area
// ======================================================================
let playing = null;   // {kind:'clip', id} or {kind:'timelapse', date}

function play(item) {
  playing = item;
  const live = $('live'), v = $('player');
  live.removeAttribute('src');         // stop pulling the MJPEG stream while watching a recording
  if (item.kind === 'clip') {
    const c = clipById(item.id);
    v.src = '/media/' + item.id + '.mp4';
    $('ptitle').innerHTML = c
      ? `<b>${esc(c.date)} ${esc(c.time)}</b> · ${c.manual ? 'manual' : 'motion'} clip · ${dur(c.duration)}`
      : esc(item.id);
    $('badge').textContent = 'RECORDING ' + (c ? c.time : '');
  } else {
    v.src = '/media/timelapse/' + item.date + '.mp4?' + Date.now();
    $('ptitle').innerHTML = `<b>Time-lapse ${esc(item.date)}</b>`;
    $('badge').textContent = 'TIME-LAPSE ' + item.date;
  }
  $('badge').classList.remove('live');
  document.body.classList.add('playing');
  updateStepButtons();
  v.play().catch(() => {});
  if (tabIs('recordings')) renderRecordings();
}

function goLive() {
  const v = $('player');
  v.pause(); v.removeAttribute('src'); v.load();
  playing = null;
  document.body.classList.remove('playing');
  restartLive();
  $('badge').textContent = 'LIVE'; $('badge').classList.add('live');
  if (tabIs('recordings')) renderRecordings();
}

// A fresh <img> for every (re)start: browsers often leave a reused or backgrounded
// MJPEG <img> stalled on a black or frozen frame until the page is reloaded.
function restartLive() {
  const old = $('live'), img = old.cloneNode(false);
  img.src = '/stream.mjpg?' + Date.now();
  old.removeAttribute('src');
  old.replaceWith(img);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !playing) restartLive(); });
addEventListener('pageshow', e => { if (e.persisted && !playing) restartLive(); });

// prev/next walk the selected day's clips in time order
function dayClips() { return (lib ? lib.clips : []).filter(c => c.date === selectedDay && !c.recording).sort((a, b) => a.tod - b.tod); }
function step(dir) {
  if (!playing || playing.kind !== 'clip') return;
  const list = dayClips(), i = list.findIndex(c => c.id === playing.id);
  const next = list[i + dir];
  if (next) play({ kind: 'clip', id: next.id });
}
function updateStepButtons() {
  const isClip = playing && playing.kind === 'clip';
  const list = dayClips(), i = isClip ? list.findIndex(c => c.id === playing.id) : -1;
  $('prevBtn').style.display = $('nextBtn').style.display = isClip ? '' : 'none';
  $('prevBtn').disabled = i <= 0;
  $('nextBtn').disabled = i < 0 || i >= list.length - 1;
}
$('player').addEventListener('ended', () => { if (playing && playing.kind === 'clip' && !$('nextBtn').disabled) step(1); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'Escape' && playing) goLive();
  if (playing && e.key === 'ArrowLeft' && e.shiftKey) step(-1);
  if (playing && e.key === 'ArrowRight' && e.shiftKey) step(1);
});

// ======================================================================
// recordings: data
// ======================================================================
let lib = null, selectedDay = null, fitTimeline = true;
const clipById = id => lib && lib.clips.find(c => c.id === id);

async function loadLibrary() {
  try { lib = await api('/api/recordings'); } catch (e) { console.error(e); return; }
  const days = [...new Set([...lib.clips.map(c => c.date), ...lib.timelapse.map(t => t.date)])].sort().reverse();
  const sel = $('day');
  const today = new Date().toISOString().slice(0, 10);
  if (!selectedDay || !days.includes(selectedDay)) selectedDay = days[0] || today;
  sel.innerHTML = (days.length ? days : [selectedDay]).map(d => {
    const n = lib.clips.filter(c => c.date === d).length;
    return `<option value="${esc(d)}">${esc(d)}${d === today ? ' (today)' : ''} — ${n} clip${n === 1 ? '' : 's'}</option>`;
  }).join('');
  sel.value = selectedDay;
  renderRecordings();
}

// ======================================================================
// recordings: formatting
// ======================================================================
const pad = n => String(n).padStart(2, '0');
const clock = s => { s = Math.max(0, Math.round(s)); return s >= 86400 ? '24:00' : pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60); };
const clockS = s => { s = Math.max(0, Math.round(s)); return clock(s) + ':' + pad(s % 60); };
const dur = d => d === undefined || d === null ? '–' : d >= 3600 ? Math.floor(d / 3600) + 'h ' + Math.round(d % 3600 / 60) + 'm'
  : d >= 60 ? Math.floor(d / 60) + 'm ' + pad(Math.round(d % 60)) + 's' : Math.round(d) + 's';
const mb = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const gb = b => (b / 1073741824).toFixed(b > 1073741824 * 10 ? 0 : 1) + ' GB';

// tooltip
const tip = $('tip');
function showTip(e, html) { tip.innerHTML = html; tip.style.display = 'block'; moveTip(e); }
function moveTip(e) {
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 12, y = e.clientY + 12;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 12;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.style.display = 'none'; }
function clipTip(c) {
  return `<b>${esc(c.time)}</b> · ${c.manual ? 'manual' : 'motion'}${c.recording ? ' · <span class="rec">recording</span>' : ''}<br>
    <span class="m">${clockS(c.tod)} → ${clockS(c.tod + (c.duration || 0))} · ${dur(c.duration)}</span>
    ${c.peak !== undefined ? `<br><span class="m">peak motion ${c.peak.toFixed(2)}% · ${mb(c.size)}</span>` : ''}
    ${c.recording ? '' : '<br><span class="m">click to play</span>'}`;
}

// nice tick step (seconds) for a time axis span
function tickStep(span) {
  for (const m of [5, 10, 15, 30, 60, 120, 180, 360]) if (span / (m * 60) <= 6) return m * 60;
  return 360 * 60;
}

// rounded-top bar anchored to the baseline
function barPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  if (h <= 0) return '';
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

// ======================================================================
// recordings: render
// ======================================================================
function renderRecordings() {
  if (!lib) return;
  const clips = lib.clips.filter(c => c.date === selectedDay).sort((a, b) => a.tod - b.tod);
  const done = clips.filter(c => !c.recording);
  const total = clips.reduce((s, c) => s + (c.duration || 0), 0);
  const longest = clips.reduce((m, c) => Math.max(m, c.duration || 0), 0);
  const perHour = new Array(24).fill(0);
  for (const c of clips) {
    let a = c.tod; const b = c.tod + (c.duration || 0);
    while (a < b) { const h = Math.min(23, Math.floor(a / 3600)), e = Math.min(b, (h + 1) * 3600); perHour[h] += e - a; a = e; if (h === 23) break; }
  }
  const busiest = perHour.reduce((best, secs, h) => secs > best.secs ? { h, secs } : best, { h: 0, secs: 0 });

  $('disk').textContent = `${gb(lib.disk.used)} of recordings · ${gb(lib.disk.free)} free on the SD card`;
  $('tiles').innerHTML = `
    <div class="tile"><div class="k">Clips</div><div class="v">${clips.length}</div>
      <div class="s">${clips.filter(c => c.manual).length} manual</div></div>
    <div class="tile"><div class="k">Recorded</div><div class="v">${dur(total)}</div>
      <div class="s">longest ${dur(longest)}</div></div>
    <div class="tile"><div class="k">Busiest hour</div><div class="v">${busiest.secs ? pad(busiest.h) + ':00' : '–'}</div>
      <div class="s">${busiest.secs ? dur(busiest.secs) + ' recorded' : 'no clips'}</div></div>`;

  renderTimeline(clips);
  renderHourly(clips);
  renderTimelapse();
  renderLog(clips);
  updateStepButtons();
}

function renderTimeline(clips) {
  const svg = $('timeline');
  const W = svg.clientWidth || 348, H = 58, top = 6, barH = 26, axisY = top + barH + 6;
  $('fitBtn').textContent = fitTimeline ? 'Show full day' : 'Zoom to activity';
  $('fitBtn').style.display = clips.length ? '' : 'none';
  $('tlLegend').style.display = clips.length ? '' : 'none';
  let t0 = 0, t1 = 86400;
  if (fitTimeline && clips.length) {
    const lo = clips[0].tod, hi = Math.max(...clips.map(c => c.tod + (c.duration || 0)));
    const span = Math.max(hi - lo, 600);
    const s = tickStep(span * 1.1);
    t0 = Math.max(0, Math.floor((lo - span * 0.05) / s) * s);
    t1 = Math.min(86400, Math.ceil((hi + span * 0.05) / s) * s);
  }
  const x = t => (t - t0) / (t1 - t0) * W;
  const st = tickStep(t1 - t0);
  let g = '';
  for (let t = Math.ceil(t0 / st) * st; t <= t1; t += st) {
    const xx = x(t);
    g += `<line x1="${xx}" x2="${xx}" y1="${top}" y2="${top + barH}" stroke="var(--grid)"/>`;
    const anchor = xx < 12 ? 'start' : xx > W - 12 ? 'end' : 'middle';
    g += `<text x="${xx}" y="${axisY + 9}" text-anchor="${anchor}">${clock(t)}</text>`;
  }
  g += `<line x1="0" x2="${W}" y1="${top + barH}" y2="${top + barH}" stroke="var(--axis)"/>`;
  if (!clips.length) g += `<text x="${W / 2}" y="${top + barH / 2 + 3}" text-anchor="middle">No clips this day</text>`;
  clips.forEach((c, i) => {
    const x0 = x(c.tod), w = Math.max(3, x(c.tod + (c.duration || 0)) - x0);
    const sel = playing && playing.kind === 'clip' && playing.id === c.id ? ' sel' : '';
    const fill = c.manual ? 'var(--series-manual)' : 'var(--series-motion)';
    // hit target wider than the mark; mark has a 1px surface ring so adjacent clips stay separate
    g += `<rect class="hit" data-i="${i}" x="${x0 - 4}" y="0" width="${w + 8}" height="${top + barH + 2}"/>`;
    g += `<rect class="mark${sel}" x="${x0}" y="${top}" width="${w}" height="${barH}" rx="2" fill="${fill}"
            stroke="var(--panel)" stroke-width="1" ${c.recording ? 'opacity=".55"' : ''} pointer-events="none"/>`;
  });
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('height', H);
  svg.innerHTML = g;
  svg.querySelectorAll('.hit').forEach(el => {
    const c = clips[+el.dataset.i];
    el.onmouseenter = e => showTip(e, clipTip(c));
    el.onmousemove = moveTip;
    el.onmouseleave = hideTip;
    el.onclick = () => { hideTip(); if (!c.recording) play({ kind: 'clip', id: c.id }); };
  });
}

function renderHourly(clips) {
  const svg = $('hourly');
  const W = svg.clientWidth || 348, H = 120, left = 30, top = 8, bottom = 18, ph = H - top - bottom, pw = W - left;
  const motion = new Array(24).fill(0), manual = new Array(24).fill(0), counts = new Array(24).fill(0);
  for (const c of clips) {                     // split each clip across the hours it spans
    const into = c.manual ? manual : motion;
    let a = c.tod; const b = c.tod + (c.duration || 0);
    counts[Math.min(23, Math.floor(a / 3600))]++;
    while (a < b) {
      const h = Math.min(23, Math.floor(a / 3600)), end = Math.min(b, (h + 1) * 3600);
      into[h] += Math.max(0, end - a); a = end; if (h === 23) break;
    }
  }
  const secs = motion.map((m, h) => m + manual[h]);
  $('hrLegend').style.display = clips.length ? '' : 'none';
  const max = Math.max(...secs);
  const useMin = max >= 120;
  const unit = useMin ? 60 : 1;
  $('hourUnit').textContent = useMin ? '· minutes' : '· seconds';
  const vmax = max / unit;
  const stepV = [1, 2, 5, 10, 15, 20, 30, 60].find(s => vmax / s <= 3) || 60;
  const ymax = Math.max(stepV, Math.ceil(vmax / stepV) * stepV);
  const y = v => top + ph - v / ymax * ph;
  let g = '';
  for (let v = 0; v <= ymax; v += stepV) {
    g += `<line x1="${left}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? 'var(--axis)' : 'var(--grid)'}"/>`;
    g += `<text x="${left - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  }
  const slot = pw / 24, bw = Math.max(2, slot - 2);   // 2px surface gap between bars
  for (let h = 0; h < 24; h++) {
    const bx = left + h * slot + 1;
    if (h % 6 === 0) g += `<text x="${bx + bw / 2}" y="${H - 4}" text-anchor="middle">${pad(h)}</text>`;
    g += `<rect class="hit" data-h="${h}" x="${left + h * slot}" y="${top}" width="${slot}" height="${ph}"/>`;
    // stacked: motion at the baseline, manual on top; 2px surface gap between segments,
    // rounded corners only on the topmost segment
    const hm = motion[h] / unit / ymax * ph, hn = manual[h] / unit / ymax * ph;
    const base = top + ph;
    if (hm > 0) g += hn > 0
      ? `<rect x="${bx}" y="${base - hm}" width="${bw}" height="${hm}" fill="var(--series-motion)" pointer-events="none"/>`
      : `<path d="${barPath(bx, base - hm, bw, hm, 4)}" fill="var(--series-motion)" pointer-events="none"/>`;
    if (hn > 0) {
      const gap = hm > 0 ? 2 : 0, hh = Math.max(1, hn - gap);
      g += `<path d="${barPath(bx, base - hm - gap - hh, bw, hh, 4)}" fill="var(--series-manual)" pointer-events="none"/>`;
    }
  }
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('height', H);
  svg.innerHTML = g;
  svg.querySelectorAll('.hit').forEach(el => {
    const h = +el.dataset.h;
    el.onmouseenter = e => showTip(e, `<b>${pad(h)}:00–${pad((h + 1) % 24)}:00</b><br>
      <span class="m">${dur(secs[h])} recorded${manual[h] ? ` (${dur(motion[h])} motion, ${dur(manual[h])} manual)` : ''}<br>
      ${counts[h]} clip${counts[h] === 1 ? '' : 's'} started</span>`);
    el.onmousemove = moveTip;
    el.onmouseleave = hideTip;
  });
}

function renderTimelapse() {
  const t = lib.timelapse.find(t => t.date === selectedDay);
  const box = $('tlapse');
  if (!t) { box.innerHTML = '<div class="empty">No time-lapse photos this day.</div>'; return; }
  const hm = s => s ? s.slice(0, 2) + ':' + s.slice(2, 4) : '';
  const d = esc(t.date);
  box.innerHTML = `
    <div class="tl">
      ${t.latest ? `<img src="/media/${esc(t.latest)}" loading="lazy" alt="">` : ''}
      <div class="info"><b>${t.count} photos</b> · ${hm(t.first)}–${hm(t.last)}
        <div>${t.building ? 'building video…' : t.video ? 'video ready · ' + mb(t.video_size) : 'no video built yet'}</div>
        <div class="actions">
          ${t.video ? `<button onclick="play({kind:'timelapse', date:'${d}'})">▶ Play</button>` : ''}
          ${t.building ? '' : `<select id="tlfps" title="playback speed"><option value="10">10 fps</option><option value="15" selected>15 fps</option><option value="30">30 fps</option></select>
            <button onclick="buildTimelapse('${d}')">${t.video ? 'Rebuild' : 'Build video'}</button>`}
          ${t.video ? `<a class="btn" href="/media/timelapse/${d}.mp4" download>⤓</a>` : ''}
          <button class="del" onclick="deleteDay('${d}')" title="Delete this day's photos and video">✕</button>
        </div>
      </div>
    </div>`;
}

function renderLog(clips) {
  const rows = clips.slice().reverse();     // newest first
  $('logCount').textContent = rows.length ? '· ' + rows.length + (rows.length === 1 ? ' clip' : ' clips') : '';
  if (!rows.length) { $('log').innerHTML = '<div class="empty">No clips this day. Clips appear here when the crabs move.</div>'; return; }
  $('log').innerHTML = `<table class="log">
    <thead><tr><th>Start</th><th>Length</th><th>Type</th><th>Peak</th><th></th></tr></thead>
    <tbody>${rows.map(c => {
      const sel = playing && playing.kind === 'clip' && playing.id === c.id ? ' sel' : '';
      const color = c.manual ? 'var(--series-manual)' : 'var(--series-motion)';
      return `<tr class="clip${sel}" data-id="${esc(c.id)}">
        <td class="t">${esc(c.time)}</td>
        <td>${c.recording ? '<span class="rec">● REC</span> ' + dur(c.duration) : dur(c.duration)}</td>
        <td><span class="sw" style="background:${color}"></span>${c.manual ? 'manual' : 'motion'}</td>
        <td>${c.peak !== undefined ? c.peak.toFixed(1) + '%' : '–'}</td>
        <td class="act">${c.recording ? '' : `<a class="btn" href="/media/${esc(c.id)}.mp4" download title="Download (${mb(c.size)})" onclick="event.stopPropagation()">⤓</a>
          <button class="del" title="Delete" onclick="event.stopPropagation(); deleteClip('${esc(c.id)}')">✕</button>`}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
  $('log').querySelectorAll('tr.clip').forEach(tr => {
    const c = clipById(tr.dataset.id);
    tr.onclick = () => { if (c && !c.recording) play({ kind: 'clip', id: c.id }); };
  });
}

// ======================================================================
// recordings: actions
// ======================================================================
async function deleteClip(id) {
  if (!confirm('Delete this clip?')) return;
  try {
    await api('/api/recordings/delete', { clip: id });
    if (playing && playing.id === id) goLive();
  } catch (e) { alert(e.message); }
  loadLibrary();
}
async function deleteDay(d) {
  if (!confirm('Delete all time-lapse photos and the video for ' + d + '?')) return;
  try {
    await api('/api/recordings/delete', { timelapse: d });
    if (playing && playing.kind === 'timelapse' && playing.date === d) goLive();
  } catch (e) { alert(e.message); }
  loadLibrary();
}
async function buildTimelapse(d) {
  const fps = $('tlfps') ? +$('tlfps').value : 15;
  try { await api('/api/timelapse/build', { date: d, fps }); } catch (e) { alert(e.message); }
  loadLibrary();
  const poll = setInterval(async () => {   // refresh until the build finishes
    await loadLibrary();
    const t = lib && lib.timelapse.find(t => t.date === d);
    if (!t || !t.building) clearInterval(poll);
  }, 3000);
}

// keep the log fresh while the tab is open; redraw charts on resize
setInterval(() => { if (tabIs('recordings') && document.visibilityState === 'visible') loadLibrary(); }, 15000);
addEventListener('resize', () => { if (tabIs('recordings')) renderRecordings(); });

// ======================================================================
// start
// ======================================================================
(async () => {
  const r = await api('/api/settings');
  schema = r.schema; values = r.values;
  build(); sync(); pollStatus();
  if (location.hash === '#recordings') showTab('recordings');
})();
</script>
</body></html>
